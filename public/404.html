<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Nazeer Ahmed</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 80% 0%, rgba(96, 165, 250, 0.16), transparent 26rem),
          radial-gradient(circle at 10% 100%, rgba(167, 139, 250, 0.12), transparent 24rem),
          #05070f;
        color: #a6b2c8;
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 32rem;
        padding: clamp(1.75rem, 6vw, 3rem);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 1.5rem;
        background: rgba(13, 19, 36, 0.72);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.38);
      }

      .code {
        color: #60a5fa;
        font-family: 'Sora', 'Inter', sans-serif;
        font-size: clamp(3.5rem, 14vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      h1 {
        margin-top: 0.75rem;
        color: #f8fafc;
        font-family: 'Sora', 'Inter', sans-serif;
        font-size: clamp(1.4rem, 4vw, 1.9rem);
        letter-spacing: -0.03em;
      }

      p {
        margin-top: 0.75rem;
        font-size: 0.92rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: linear-gradient(120deg, #60a5fa, #a78bfa);
        color: #ffffff;
        font-size: 0.86rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      a:hover {
        box-shadow: 0 16px 42px rgba(96, 165, 250, 0.3);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page wandered off.</h1>
      <p>
        The page you are looking for does not exist or may have moved. Let&apos;s get you back to
        the portfolio.
      </p>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
