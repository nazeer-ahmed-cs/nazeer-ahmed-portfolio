<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" role="img" aria-label="SysMonitor terminal preview showing process activity and system call traces">
  <defs>
    <linearGradient id="sys-bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101F"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="sys-accent" x1="120" y1="80" x2="700" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="sys-bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="sys-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <pattern id="sys-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#94A3B8" fill-opacity=".1"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#sys-bg)"/>
  <rect width="800" height="520" fill="url(#sys-dots)" opacity=".65"/>
  <circle cx="680" cy="90" r="190" fill="#22D3EE" fill-opacity=".07"/>
  <circle cx="110" cy="460" r="170" fill="#A78BFA" fill-opacity=".06"/>

  <g filter="url(#sys-shadow)">
    <rect x="32" y="28" width="736" height="464" rx="18" fill="#080E1B" stroke="#94A3B8" stroke-opacity=".18"/>
    <rect x="32" y="28" width="736" height="46" rx="18" fill="#0A1222"/>
    <rect x="32" y="54" width="736" height="20" fill="#0A1222"/>
    <circle cx="58" cy="51" r="5" fill="#F87171"/>
    <circle cx="76" cy="51" r="5" fill="#FBBF24"/>
    <circle cx="94" cy="51" r="5" fill="#34D399"/>
    <text x="120" y="55" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">nazeer@linux: ~/sysmonitor</text>
    <rect x="610" y="41" width="138" height="20" rx="10" fill="#111C34"/>
    <text x="679" y="55" text-anchor="middle" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="9">bash — 120x34</text>

    <g font-family="JetBrains Mono, monospace" font-size="10">
      <text x="56" y="98" fill="#34D399">nazeer@linux</text>
      <text x="130" y="98" fill="#64748B">:</text>
      <text x="138" y="98" fill="#60A5FA">~/sysmonitor</text>
      <text x="220" y="98" fill="#64748B">$</text>
      <text x="232" y="98" fill="#F8FAFC">sudo ./sysmonitor --trace all</text>

      <text x="56" y="120" fill="#64748B">[INFO]</text>
      <text x="104" y="120" fill="#A6B2C8">Initializing syscall interceptor ...</text>
      <text x="56" y="136" fill="#64748B">[INFO]</text>
      <text x="104" y="136" fill="#A6B2C8">Attaching to kernel tracepoints ... done</text>
      <text x="56" y="152" fill="#64748B">[INFO]</text>
      <text x="104" y="152" fill="#A6B2C8">Monitoring 42 running processes</text>

      <rect x="56" y="166" width="688" height="24" rx="5" fill="#0C1628" stroke="#22D3EE" stroke-opacity=".25"/>
      <text x="68" y="182" fill="#22D3EE" font-size="9">PID</text>
      <text x="128" y="182" fill="#22D3EE" font-size="9">PROCESS</text>
      <text x="268" y="182" fill="#22D3EE" font-size="9">SYSCALL</text>
      <text x="410" y="182" fill="#22D3EE" font-size="9">RET</text>
      <text x="474" y="182" fill="#22D3EE" font-size="9">DURATION</text>
      <text x="580" y="182" fill="#22D3EE" font-size="9">STATE</text>

      <text x="68" y="208" fill="#94A3B8">1024</text>
      <text x="128" y="208" fill="#F8FAFC">bash</text>
      <text x="268" y="208" fill="#60A5FA">read</text>
      <text x="410" y="208" fill="#34D399">0</text>
      <text x="474" y="208" fill="#94A3B8">0.42ms</text>
      <text x="580" y="208" fill="#34D399">RUNNING</text>

      <text x="68" y="226" fill="#94A3B8">1187</text>
      <text x="128" y="226" fill="#F8FAFC">firefox</text>
      <text x="268" y="226" fill="#A78BFA">epoll_wait</text>
      <text x="410" y="226" fill="#34D399">0</text>
      <text x="474" y="226" fill="#94A3B8">1.08ms</text>
      <text x="580" y="226" fill="#34D399">RUNNING</text>

      <text x="68" y="244" fill="#94A3B8">1203</text>
      <text x="128" y="244" fill="#F8FAFC">python3</text>
      <text x="268" y="244" fill="#60A5FA">openat</text>
      <text x="410" y="244" fill="#34D399">3</text>
      <text x="474" y="244" fill="#94A3B8">0.19ms</text>
      <text x="580" y="244" fill="#34D399">RUNNING</text>

      <text x="68" y="262" fill="#94A3B8">1290</text>
      <text x="128" y="262" fill="#F8FAFC">code</text>
      <text x="268" y="262" fill="#A78BFA">write</text>
      <text x="410" y="262" fill="#FBBF24">-1</text>
      <text x="474" y="262" fill="#94A3B8">0.07ms</text>
      <text x="580" y="262" fill="#FBBF24">WAITING</text>

      <text x="68" y="280" fill="#94A3B8">1302</text>
      <text x="128" y="280" fill="#F8FAFC">gnome-shell</text>
      <text x="268" y="280" fill="#60A5FA">recvmsg</text>
      <text x="410" y="280" fill="#34D399">12</text>
      <text x="474" y="280" fill="#94A3B8">0.31ms</text>
      <text x="580" y="280" fill="#34D399">RUNNING</text>

      <text x="68" y="298" fill="#94A3B8">1355</text>
      <text x="128" y="298" fill="#F8FAFC">sysmonitor</text>
      <text x="268" y="298" fill="#22D3EE">ptrace</text>
      <text x="410" y="298" fill="#34D399">0</text>
      <text x="474" y="298" fill="#94A3B8">0.12ms</text>
      <text x="580" y="298" fill="#34D399">RUNNING</text>
    </g>

    <rect x="56" y="318" width="336" height="154" rx="10" fill="#0B1424" stroke="#94A3B8" stroke-opacity=".12"/>
    <text x="72" y="340" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">SYSCALL FREQUENCY</text>
    <g fill="url(#sys-bar)">
      <rect x="72" y="416" width="18" height="40" rx="3"/>
      <rect x="104" y="392" width="18" height="64" rx="3"/>
      <rect x="136" y="404" width="18" height="52" rx="3"/>
      <rect x="168" y="368" width="18" height="88" rx="3"/>
      <rect x="200" y="386" width="18" height="70" rx="3"/>
      <rect x="232" y="352" width="18" height="104" rx="3"/>
      <rect x="264" y="376" width="18" height="80" rx="3"/>
      <rect x="296" y="360" width="18" height="96" rx="3"/>
      <rect x="328" y="396" width="18" height="60" rx="3"/>
      <rect x="360" y="380" width="18" height="76" rx="3"/>
    </g>
    <text x="72" y="464" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="8">read  write  open  mmap  ioctl</text>

    <rect x="408" y="318" width="336" height="154" rx="10" fill="#0B1424" stroke="#94A3B8" stroke-opacity=".12"/>
    <text x="424" y="340" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">SYSTEM LOAD</text>
    <text x="424" y="368" fill="#F8FAFC" font-family="Sora, Inter, sans-serif" font-size="20" font-weight="700">3.24</text>
    <text x="468" y="368" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="9">load average</text>
    <path d="M424 452C452 452 462 430 488 434C514 438 524 412 550 418C576 424 588 396 614 402C640 408 652 386 678 390C704 394 716 376 728 380" stroke="url(#sys-accent)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M424 452C452 452 462 430 488 434C514 438 524 412 550 418C576 424 588 396 614 402C640 408 652 386 678 390C704 394 716 376 728 380V464H424V452Z" fill="url(#sys-accent)" fill-opacity=".08"/>
    <g stroke="#94A3B8" stroke-opacity=".1">
      <path d="M424 396H728M424 428H728M424 460H728"/>
    </g>
    <text x="424" y="462" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="8">60s ago</text>
    <text x="708" y="462" text-anchor="end" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="8">now</text>
  </g>
</svg>
